[preset.0]

name="Quest 1"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter=""
export_path="../build/slopitect-quest1-debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="io.github.bubbagum88.slopitect"
package/name="Slopitect"
package/signed=true
package/show_in_app_library=true
; Needed from step 3 on, when the laptop talks to the app.
permissions/internet=true
; 1 = OpenXR
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/hand_tracking=0
meta_xr_features/passthrough=0
meta_xr_features/quest_1_support=true
meta_xr_features/quest_2_support=true
; Naming quest3 or questpro makes the Quest 1 runtime abort at start.
meta_xr_features/quest_3_support=false
meta_xr_features/quest_pro_support=false
