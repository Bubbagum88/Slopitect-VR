name: Quest 1 APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  # From Godot's SHA512-SUMS.txt for 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  VENDORS_VERSION: 5.1.0-stable
  VENDORS_SHA512: 2e60b98306c6bf6e8dd1bef28bf6393f00dd5c2d1c6ad764c3572d235b1bef3de7d0efda2452fe238a0988657b2a346e39fdf59f4f8d4d3b5206b8cd95090945
  # godot-whisper (MIT): on-headset speech to text. Built from this commit
  # (whisper.cpp v1.8.4 as its submodule), with the NDK its godot-cpp asks for.
  WHISPER_COMMIT: e490cbbb74b0f79abc787b34970f18dc15b258f3
  WHISPER_NDK: 23.2.8568313

jobs:
  whisper:
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: whisper-out
          key: godot-whisper-${{ env.WHISPER_COMMIT }}-android-arm64-linux-x86_64-ndk${{ env.WHISPER_NDK }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: appsinacup/godot-whisper
          ref: ${{ env.WHISPER_COMMIT }}
          path: godot-whisper
          submodules: true

      # The Quest's library goes in the APK. The Linux one is for the editor
      # that imports and exports the project here: Godot 4.7.2 aborts on exit
      # (exit 134) when a listed extension has no library for its own system.
      - name: Build godot-whisper for the Quest (Android arm64) and for Linux
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # yes is cut off (SIGPIPE) once sdkmanager is done; that isn't a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${WHISPER_NDK}" > /dev/null
          test -d "$ANDROID_HOME/ndk/${WHISPER_NDK}" || { echo "::error::NDK ${WHISPER_NDK} did not install"; exit 1; }
          pip install scons
          cd godot-whisper
          scons platform=android arch=arm64 target=template_release -j"$(nproc)"
          scons platform=linux arch=x86_64 target=template_release -j"$(nproc)"
          mkdir -p ../whisper-out/bin
          cp bin/addons/godot_whisper/bin/libgodot_whisper.android.template_release.arm64.so \
            bin/addons/godot_whisper/bin/libgodot_whisper.linux.template_release.x86_64.so ../whisper-out/bin/
          cp LICENSE THIRDPARTY.txt ../whisper-out/

      - uses: actions/upload-artifact@v4
        with:
          name: godot-whisper
          path: whisper-out

  build:
    needs: whisper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Godot, export templates and the OpenXR vendors plugin
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL -o vendors.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}/godotopenxrvendorsaddon.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c
          echo "$TEMPLATES_SHA512  templates.tpz" | sha512sum -c
          echo "$VENDORS_SHA512  vendors.zip" | sha512sum -c

          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q templates.tpz
          mv templates/* "$tdir/"
          unzip -q vendors.zip
          mkdir -p game/addons
          mv asset/addons/godotopenxrvendors game/addons/

      - uses: actions/download-artifact@v4
        with:
          name: godot-whisper
          path: game/addons/godot_whisper

      - name: Import the project
        run: |
          set -euo pipefail
          # Register the plugin before Godot first opens the project. Without
          # this, Godot finds and loads the plugin partway through the import,
          # then crashes on exit (SIGSEGV, exit 134; Godot 4.7.2 with plugin
          # 5.1.0). Listed up front, it loads at start-up as it does on every
          # later open of the project, and the import exits cleanly.
          mkdir -p game/.godot
          printf '%s\n' res://addons/godotopenxrvendors/plugin.gdextension \
            res://addons/godot_whisper/godot_whisper.gdextension > game/.godot/extension_list.cfg
          ./godot --headless --path game --import

      - name: Export the APK
        env:
          # A fixed debug key kept in the repo, so each new APK installs over the
          # last one. It's a debug key: anyone with the repo can sign with it.
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path game --install-android-build-template \
            --export-debug "Quest 1" ../build/slopitect-quest1-debug.apk
          test -s build/slopitect-quest1-debug.apk || { echo "::error::Godot did not write the APK"; exit 1; }

      - name: Check the APK for the Quest 1
        run: |
          set -euo pipefail
          apk=build/slopitect-quest1-debug.apk
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          aapt2="$tools/aapt2"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          echo "--- manifest lines that matter on a Quest 1 ---"
          grep -n -A2 -E "supportedDevices|minSdkVersion|targetSdkVersion|horizonos|debuggable|requestLegacyExternalStorage" manifest.txt || true
          fail=0
          devices=$(grep -A1 'com.oculus.supportedDevices' manifest.txt | grep -o '"[^"]*"' | tail -1 | tr -d '"')
          echo "supportedDevices = $devices"
          [ "$devices" = "quest|quest2" ] || { echo "::error::supportedDevices is '$devices', expected 'quest|quest2' (anything else aborts on the Quest 1)"; fail=1; }
          # Permissions declared now so later features don't need a new APK;
          # each is only asked for when a feature first needs it.
          for perm in INTERNET RECORD_AUDIO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE; do
            grep -q "android.permission.$perm\"" manifest.txt && echo "has permission $perm" || { echo "::error::missing permission $perm"; fail=1; }
          done
          for lib in lib/arm64-v8a/libgodot_android.so lib/arm64-v8a/libgodotopenxrvendors.so lib/arm64-v8a/libgodot_whisper.android.template_release.arm64.so; do
            unzip -l "$apk" "$lib" > /dev/null && echo "has $lib" || { echo "::error::missing $lib"; fail=1; }
          done
          # Signed with ci/debug.keystore, so it installs over earlier builds.
          expected=1af887e3d0bf44b1e7bb1b3593896f705c9c84b6b08e636bf2d1f92e1dcdbc6b
          signer=$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "signer SHA-256 = $signer"
          [ "$signer" = "$expected" ] || { echo "::error::APK is signed with $signer, expected the repo's debug key $expected"; fail=1; }
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: slopitect-quest1-debug
          path: build/slopitect-quest1-debug.apk
